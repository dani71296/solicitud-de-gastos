<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitud de Gastos - El Refugio Ward</title>
  
  <link rel="stylesheet" href="./styles.css">

  <!-- Scripts externos independientes -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="./app.js"></script>
  <script src="./main.js"></script>
</head>
<body>

<div class="container">
  <h2>SOLICITUD DE GASTOS</h2>
  <form id="gastosForm">

    <!-- PROPÓSITO DEL GASTO -->
    <fieldset>
      <legend>Propósito del Gasto</legend>
      <div class="radio-group">
        <label class="radio-option">
          <input type="radio" name="proposito" value="Reembolso" checked> Reembolso
        </label>
        <label class="radio-option">
          <input type="radio" name="proposito" value="Por adelantado"> Por adelantado
        </label>
      </div>
    </fieldset>

    <!-- DATOS DEL SOLICITANTE -->
    <fieldset>
      <legend>Solicitante</legend>
      <div class="form-group">
        <label for="solicitanteNombre">Nombre del Solicitante *</label>
        <input type="text" id="solicitanteNombre" placeholder="Tu nombre completo" required>
      </div>
      <div class="form-group">
        <label for="fecha">Fecha *</label>
        <input type="date" id="fecha" required>
      </div>
    </fieldset>

    <!-- DATOS DEL BENEFICIARIO (PAGAR A) -->
    <fieldset>
      <legend>Datos del Beneficiario (Pagar A)</legend>
      <div class="form-group">
        <label for="selectBeneficiario">Seleccionar Beneficiario *</label>
        <select id="selectBeneficiario" required>
          <option value="">-- Selecciona un beneficiario --</option>
        </select>
      </div>
      
      <!-- Campo de texto si eligen escribir un nombre personalizado -->
      <div class="form-group" id="grupoNombreManual" style="display: none;">
        <label for="pagarNombre">Nombre Personalizado *</label>
        <input type="text" id="pagarNombre" placeholder="Escribe el nombre completo">
      </div>

      <div class="form-group">
        <label for="pagarDireccion">Dirección *</label>
        <input type="text" id="pagarDireccion" placeholder="Calle, número, colonia" required>
      </div>
    </fieldset>

    <!-- RAZÓN DEL GASTO -->
    <fieldset>
      <legend>Propósito / Razón</legend>
      <div class="form-group">
        <label for="razon">Razón *</label>
        <input type="text" id="razon" placeholder="Escribe el motivo del gasto" required>
      </div>
    </fieldset>

    <!-- CATEGORÍAS Y MONTOS -->
    <fieldset>
      <legend>Categorías y Montos</legend>
      
      <!-- Categoría 1: Obligatoria -->
      <div class="form-row">
        <div class="col-main">
          <label for="categoria1">Categoría 1 *</label>
          <select id="categoria1" class="select-categoria" required></select>
        </div>
        <div class="col-side">
          <label for="monto1">Monto 1 *</label>
          <input type="number" step="0.01" id="monto1" class="input-monto" placeholder="0.00" required>
        </div>
      </div>

      <!-- Categoría 2: Opcional -->
      <div class="form-row">
        <div class="col-main">
          <label for="categoria2">Categoría 2 (Opcional)</label>
          <select id="categoria2" class="select-categoria"></select>
        </div>
        <div class="col-side">
          <label for="monto2">Monto 2 (Opcional)</label>
          <input type="number" step="0.01" id="monto2" class="input-monto" placeholder="0.00">
        </div>
      </div>

      <!-- Categoría 3: Opcional -->
      <div class="form-row">
        <div class="col-main">
          <label for="categoria3">Categoría 3 (Opcional)</label>
          <select id="categoria3" class="select-categoria"></select>
        </div>
        <div class="col-side">
          <label for="monto3">Monto 3 (Opcional)</label>
          <input type="number" step="0.01" id="monto3" class="input-monto" placeholder="0.00">
        </div>
      </div>

      <div class="total-display">
        Total: $<span id="lblTotal">0.00</span>
      </div>
    </fieldset>

    <!-- DATOS BANCARIOS -->
    <fieldset>
      <legend>MEX BANCOMER CAW</legend>
      <div class="form-group">
        <label for="titularCuenta">Titular de la cuenta del beneficiario *</label>
        <input type="text" id="titularCuenta" required>
      </div>
      <div class="form-group">
        <label for="tipoIdentificacion">Tipo de identificación *</label>
        <input type="text" id="tipoIdentificacion" placeholder="Ej. INE, Licencia, Pasaporte" required>
      </div>
      <div class="form-group">
        <label for="noIdentificacion">No. Identificación *</label>
        <input type="text" id="noIdentificacion" required>
      </div>
    </fieldset>

    <button type="submit" class="btn-submit">DESCARGAR PDF RELLENADO</button>
  </form>
</div>

</body>
</html>
